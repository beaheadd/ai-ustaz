<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" class="устаз" role="img" aria-labelledby="заголовок-a">
<!--
  AI Ustaz: образ ИИ-наставника («Устаз»). Концепция A: рехал с открытой книгой и дугой света.
  Подставка для Корана (рехал), на ней раскрытая книга без текста, над ней мягкая дуга света.
  Назначение: эскиз эмблемы для выбора владельцем и устазом (docs/дизайн/02-образ-устаза.md).
  В сборку не входит, пока его не импортирует экран (Metro берёт только импортированные файлы).
  Правила (CLAUDE.md, правило 9): без лица и глаз, без фигуры человека или животного, без пророков и ангелов
  (ни силуэтом, ни светом); без текста Корана и без надписей.
  Контракт:
    viewBox 0 0 120 120; показываем в 24, 48, 120 и 240 px.
    Варианты: группа «у-полный» (больше 40 px) и «у-значок» (40 px и меньше). Подключён как изображение:
      переключает @media по ширине самого SVG. Встроен в страницу: класс размера ставит страница.
    Состояния: класс на корне svg. Без класса: покой. «у-слушаю»: мягкая пульсация света, без звука.
      В «у-слушаю» ещё тонкое кольцо света (видно и без анимации). «у-объясняю»: пузырь подсказки. «у-тихо»: молчу или не уверен, свет приглушён.
    Цвета: CSS-переменные страницы с префиксом «устаз-» (основа, тон, бумага, свет, сияние, тихо);
      без них берутся свои значения, светлые или тёмные (prefers-color-scheme).
    prefers-reduced-motion: пульсации нет, свет ровный.
  Статус: черновик концепции, 19.11.2026. Растров нет, шрифтов нет, внешних ссылок нет.
-->
<title id="заголовок-a">AI Ustaz, ИИ-наставник. Концепция A: рехал с открытой книгой и дугой света</title>
<style><![CDATA[
  .устаз {
    --у0-основа: #1F5E57; --у0-тон: #E7F0EC; --у0-бумага: #FFFDF8;
    --у0-свет: #E3A73F; --у0-сияние: #F4C35E; --у0-тихо: #CDC3AE;
  }
  @media (prefers-color-scheme: dark) {
    .устаз {
      --у0-основа: #6FB7A9; --у0-тон: #1F302B; --у0-бумага: #EDE6D6;
      --у0-свет: #F2C46A; --у0-сияние: #F2C46A; --у0-тихо: #55655F;
    }
  }
  .у-основа { fill: var(--устаз-основа, var(--у0-основа)); }
  .у-тон { fill: var(--устаз-тон, var(--у0-тон)); }
  .у-бумага { fill: var(--устаз-бумага, var(--у0-бумага)); }
  .у-свет { fill: var(--устаз-свет, var(--у0-свет)); }
  .у-обвод { stroke: var(--устаз-основа, var(--у0-основа)); stroke-linejoin: round; }
  .у-линия { fill: none; stroke: var(--устаз-основа, var(--у0-основа)); stroke-linecap: round; stroke-linejoin: round; }
  .у-линия-тон { fill: none; stroke: var(--устаз-тон, var(--у0-тон)); stroke-linecap: round; }
  .у-свет-линия { fill: none; stroke: var(--устаз-свет, var(--у0-свет)); stroke-linecap: round; }
  .у-стоп-сияние { stop-color: var(--устаз-сияние, var(--у0-сияние)); }
  .у-стоп-тон { stop-color: var(--устаз-тон, var(--у0-тон)); }

  /* Размер: значок до 40 px (когда файл подключён как изображение). */
  .у-значок { display: none; }
  @media (max-width: 40px) { .у-полный { display: none; } .у-значок { display: inline; } }

  /* Состояния. Покой — без класса. */
  .у-сияние { opacity: .75; }
  .у-кольцо { display: none; }
  .у-слушаю .у-кольцо { display: inline; }
  .у-слушаю .у-сияние { opacity: 1; }
  .у-пузырь { display: none; }
  .у-объясняю .у-пузырь { display: inline; }
  .у-пульс { transform-box: fill-box; transform-origin: center; }
  .у-слушаю .у-пульс { animation: у-дыхание 2.4s ease-in-out infinite; }
  .у-слушаю .у-мерцание { animation: у-мерцание 2.4s ease-in-out infinite; }
  @keyframes у-дыхание { 0%, 100% { opacity: .4; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes у-мерцание { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .у-тихо .у-сияние { opacity: .12; }
  .у-тихо .у-свет { fill: var(--устаз-тихо, var(--у0-тихо)); }
  .у-тихо .у-свет-линия { stroke: var(--устаз-тихо, var(--у0-тихо)); stroke-dasharray: 2 7; }
  .у-тихо .у-стоп-сияние { stop-opacity: .15; }
  @media (prefers-reduced-motion: reduce) {
    .у-слушаю .у-пульс, .у-слушаю .у-мерцание { animation: none; opacity: 1; }
    .у-слушаю .у-пульс { transform: scale(1.06); }
  }
]]></style>
<defs>
  <radialGradient id="сияние-a" gradientUnits="userSpaceOnUse" cx="60" cy="58" r="54">
    <stop offset="0" class="у-стоп-сияние" stop-opacity=".7"/>
    <stop offset=".45" class="у-стоп-сияние" stop-opacity=".22"/>
    <stop offset="1" class="у-стоп-сияние" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="сияние-a-з" gradientUnits="userSpaceOnUse" cx="60" cy="52" r="58">
    <stop offset="0" class="у-стоп-сияние" stop-opacity=".7"/>
    <stop offset=".45" class="у-стоп-сияние" stop-opacity=".22"/>
    <stop offset="1" class="у-стоп-сияние" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="у-полный">
  <circle class="у-кольцо у-свет-линия у-мерцание" stroke-width="2" cx="60" cy="60" r="57"/>
  <circle class="у-сияние у-пульс" cx="60" cy="58" r="54" fill="url(#сияние-a)"/>
  <g transform="translate(0 -7)">
    <path class="у-свет-линия у-мерцание" stroke-width="5" d="M25 56A35 35 0 0 1 95 56"/>
    <path class="у-свет-линия у-мерцание" stroke-width="2.2" opacity=".55" d="M34 56A26 26 0 0 1 86 56"/>
    <path class="у-линия" stroke-width="8" d="M24 70L84 116.7M96 70L36 116.7"/>
    <circle class="у-бумага" cx="60" cy="98" r="3.2"/>
    <path class="у-основа" d="M20 57C35 54 50 55 60 62C70 55 85 54 100 57V85C84 82 70 83 60 90C50 83 36 82 20 85Z"/>
    <path class="у-бумага у-обвод" stroke-width="2" d="M60 60C50 52 37 51 24 54V80C37 77 50 78 60 86Z"/>
    <path class="у-бумага у-обвод" stroke-width="2" d="M60 60C70 52 83 51 96 54V80C83 77 70 78 60 86Z"/>
  </g>
  <g class="у-пузырь">
    <path class="у-бумага у-обвод" stroke-width="2.4" d="M88 4H110A6 6 0 0 1 116 10V22A6 6 0 0 1 110 28H94L85 35L87 28H88A6 6 0 0 1 82 22V10A6 6 0 0 1 88 4Z"/>
    <path class="у-линия" stroke-width="2.6" d="M89 13H109M89 20H102"/>
  </g>
</g>
<g class="у-значок">
  <circle class="у-кольцо у-свет-линия у-мерцание" stroke-width="5" cx="60" cy="60" r="56.5"/>
  <circle class="у-сияние у-пульс" cx="60" cy="52" r="58" fill="url(#сияние-a-з)"/>
  <path class="у-свет-линия у-мерцание" stroke-width="9" d="M26 46A34 34 0 0 1 94 46"/>
  <path class="у-линия" stroke-width="12" d="M28 76L82 113M92 76L38 113"/>
  <path class="у-основа" d="M13 50C31 45 48 46 60 55C72 46 89 45 107 50V86C89 82 72 83 60 93C48 83 31 82 13 86Z"/>
  <path class="у-бумага" d="M60 56C49 48 35 47 21 50V78C35 75 49 76 60 84Z"/>
  <path class="у-бумага" d="M60 56C71 48 85 47 99 50V78C85 75 71 76 60 84Z"/>
</g>
</svg>
