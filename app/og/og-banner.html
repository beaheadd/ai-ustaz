<!doctype html>
<!-- Баннер превью ссылки AI Ustaz (WhatsApp, Telegram и др.), 1200×630.
     Рендер: node app/og/render-og.mjs → JPEG. Без лиц, без текста Корана (только буквы алфавита и учебные слоги).
     Шрифты: Inter (системный), Amiri Quran (OFL) — путь передаётся рендером. -->
<html lang="ru"><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'AmiriQuran'; src: url('AMIRI_URL'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body { background: #1d5a4f; color: #fbf6ec; font-family: Inter, 'DejaVu Sans', sans-serif; position: relative; overflow: hidden; }
  .фон { position: absolute; inset: 0; background:
      radial-gradient(900px 500px at 105% -10%, rgba(244,226,190,.22), transparent 60%),
      radial-gradient(700px 420px at -10% 120%, rgba(0,0,0,.25), transparent 60%); }
  .узор { position: absolute; right: -40px; top: -60px; font-family: AmiriQuran; font-size: 520px; line-height: 1; color: rgba(251,246,236,.06); }
  .лево { position: absolute; left: 72px; top: 70px; width: 640px; }
  .метка { display: inline-block; padding: 8px 16px; border-radius: 999px; background: rgba(251,246,236,.14); font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -.02em; margin-top: 26px; line-height: 1; }
  h1 span { color: #f1d9a6; }
  .под { font-size: 38px; font-weight: 600; margin-top: 22px; line-height: 1.2; }
  .каз { font-size: 26px; margin-top: 10px; color: rgba(251,246,236,.75); }
  .пункты { margin-top: 34px; display: flex; gap: 14px; flex-wrap: wrap; }
  .пункты div { background: #f1d9a6; color: #1d4a41; font-weight: 700; font-size: 24px; padding: 10px 18px; border-radius: 14px; }
  .карта { position: absolute; right: 80px; top: 92px; width: 340px; height: 420px; border-radius: 36px; background: #fbf6ec; color: #1d4a41;
           box-shadow: 0 30px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .буква { font-family: AmiriQuran; font-size: 210px; line-height: 1.05; }
  .слоги { font-family: AmiriQuran; font-size: 64px; direction: rtl; margin-top: 4px; letter-spacing: .1em; }
  .подпись { font-size: 22px; color: #5f7d75; margin-top: 10px; font-weight: 600; }
  .низ { position: absolute; left: 72px; bottom: 44px; font-size: 26px; font-weight: 700; color: rgba(251,246,236,.85); }
</style></head>
<body>
  <div class="фон"></div>
  <div class="узор">ع</div>
  <div class="лево">
    <div class="метка">Бесплатно · без рекламы</div>
    <h1>AI <span>Ustaz</span></h1>
    <div class="под">Учимся правильно читать Коран</div>
    <div class="каз">Құранды дұрыс оқуды үйренеміз</div>
    <div class="пункты"><div>Буквы → слоги → слова</div><div>«Муаллим сани»</div><div>Запись голоса</div></div>
  </div>
  <div class="карта">
    <div class="буква">ب</div>
    <div class="слоги">بَ بِ بُ</div>
    <div class="подпись">урок 4 · ба, би, бу</div>
  </div>
  <div class="низ">batr.kz/aiustaz</div>
</body></html>
