<!doctype html>
<!-- Шаблон страницы AI Ustaz для `expo export`; описание — сразу после <meta charset> (кодировка — в первых 1024 байтах). -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!--
      Шаблон веб-страницы AI Ustaz для `expo export` (web.output "single"; язык и заголовок подставляет Expo из app.json —
      метки в этом комментарии писать нельзя: Expo заменяет только первое вхождение).
      Источник: expo/expo packages/@expo/cli/static/template/index.html, опубликован как @expo/cli@58.1.21 (MIT);
      коммит в npm-пакете не указан (нет gitHead) — запись в docs/источники-кода.md делает ведущий.
      Изменено: язык из app.json, встроенный SVG-значок вместо favicon.png, фон до загрузки (светлая/тёмная — токен «фон»
      дизайн-системы, app/src/theme/tokens.ts),
      строка «загружается» в #root до загрузки JS, noscript по-русски и по-казахски, referrer.
      CSP добавляет scripts/after-export.mjs (не здесь — мешала бы дев-серверу).
    -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <!-- Значок — встроенный SVG (растровых файлов в сборке нет: .gitignore batr-world их отбрасывает). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F5E57'/%3E%3Cpath d='M12 20c7-3 14-3 20 2 6-5 13-5 20-2v26c-7-3-14-3-20 2-6-5-13-5-20-2z' fill='none' stroke='%23F3E6C9' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M32 22v26' stroke='%23F3E6C9' stroke-width='3'/%3E%3C/svg%3E" />
    <!-- Сброс стилей react-native-web (рекомендация из документации RNW «root element»). -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f7f2e8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0c1715;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Строка до загрузки JS и шрифта; react-native-web заменит её при монтировании. */
      #aiustaz-zagruzka {
        margin: auto;
        padding: 16px;
        text-align: center;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #4f5f5a;
      }
      @media (prefers-color-scheme: dark) {
        #aiustaz-zagruzka {
          color: #b9c6c1;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Для AI Ustaz нужен JavaScript. / AI Ustaz үшін JavaScript қажет.</noscript>
    <div id="root"><p id="aiustaz-zagruzka" role="status">AI Ustaz загружается…<br />AI Ustaz жүктелуде…</p></div>
  </body>
</html>
