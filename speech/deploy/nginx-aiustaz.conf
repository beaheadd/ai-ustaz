# nginx для своего домена AI Ustaz (домен купит владелец; имя ниже — заменить).
# Статика веб-приложения (app/dist) + речевой сервис по /api/speech/ (127.0.0.1:8032).
# Проверка голосом — ТОЛЬКО на своём домене, не на batr.kz (QML: без рекламы и платного вокруг, CLAUDE.md).
# TLS — certbot: sudo certbot --nginx -d ДОМЕН --redirect (без HTTPS браузер не даст микрофон).
server {
    server_name ДОМЕН www.ДОМЕН;
    root /opt/mugalim/web;
    index index.html;

    # Записи голоса: до ~2 МБ (20 с WAV 16 кГц моно ≈ 640 КБ). Запись в журнал nginx не попадает (только адрес).
    location /api/speech/ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:8032/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        limit_except POST GET { deny all; }
    }

    # Сборка app/ сделана с путём /aiustaz (как на batr.kz) — та же сборка, только с флагом проверки:
    #   EXPO_PUBLIC_SPEECH_CHECK=1 MUGALIM_TARGET=own-domain npm run build:web → /opt/mugalim/web/aiustaz/
    location = / { return 302 /aiustaz/; }
    location /aiustaz/_expo/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /aiustaz/assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /aiustaz/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /aiustaz/index.html;
    }
    location = /aiustaz { return 301 /aiustaz/; }

    gzip on;
    gzip_types application/javascript text/css application/json font/ttf image/svg+xml;
    listen 80;
}
